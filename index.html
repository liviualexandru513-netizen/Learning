<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Button</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #ff9ac2 0%, #ff6ab5 38%, #ea3a8a 72%, #c3357b 100%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .feedback {
      text-align: center;
      position: relative;
      padding: 36px 24px;
      width: min(420px, 95vw);
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(14px);
    }

    .heading {
      margin: 0 0 22px;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
    }

    .beer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .beer-icon {
      width: 56px;
      height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .button-row {
      position: relative;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
      min-height: 72px;
    }

    .btn {
      padding: 16px 26px;
      min-width: 110px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff6cc7, #e91e63);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.26s ease, box-shadow 0.26s ease, left 0.2s ease, top 0.2s ease;
      position: relative;
      outline: none;
      box-shadow: 0 10px 25px rgba(233, 30, 99, 0.25);
      flex-shrink: 0;
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      box-shadow: 0 10px 22px rgba(255, 255, 255, 0.18);
    }

    .response {
      margin-top: 22px;
      font-size: 1rem;
      line-height: 1.5;
      opacity: 0.92;
      color: rgba(255, 255, 255, 0.94);
    }

    .btn:hover,
    .btn:focus {
      box-shadow: 0 14px 28px rgba(233, 30, 99, 0.32);
    }

    @media (max-width: 480px) {
      .feedback {
        width: min(100%, 95vw);
        padding: 28px 18px;
      }

      .heading {
        font-size: 1.6rem;
      }

      .beer-row {
        gap: 12px;
      }

      .button-row {
        min-height: 140px;
      }

      .btn {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="feedback">
    <h1 class="heading">Ma iubesti?</h1>
    <div class="beer-row">
      <div class="beer-icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 4H14V2H7C5.9 2 5 2.9 5 4V18C5 19.1 5.9 20 7 20H10V22H12V20H16C17.1 20 18 19.1 18 18V10H19C20.1 10 21 9.1 21 8V6C21 4.9 20.1 4 19 4H7Z" fill="#fff" opacity="0.88"/>
          <path d="M8 5H18V8H8V5Z" fill="#ffe9b8"/>
          <path d="M8 8H18V9H8V8Z" fill="#fcd76d"/>
          <path d="M8 9H18V14H8V9Z" fill="#ffd16a"/>
        </svg>
      </div>
      <div class="beer-icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 4H14V2H7C5.9 2 5 2.9 5 4V18C5 19.1 5.9 20 7 20H10V22H12V20H16C17.1 20 18 19.1 18 18V10H19C20.1 10 21 9.1 21 8V6C21 4.9 20.1 4 19 4H7Z" fill="#fff" opacity="0.88"/>
          <path d="M8 5H18V8H8V5Z" fill="#ffe9b8"/>
          <path d="M8 8H18V9H8V8Z" fill="#fcd76d"/>
          <path d="M8 9H18V14H8V9Z" fill="#ffd16a"/>
        </svg>
      </div>
    </div>
    <div class="button-row">
      <button class="btn" id="feedbackBtn">Da</button>
      <button class="btn secondary" id="noBtn" type="button">Nu</button>
    </div>
    <p class="response" id="responseText">Alege un răspuns.</p>
  </div>

  <script>
    const btn = document.getElementById('feedbackBtn');
    const noBtn = document.getElementById('noBtn');
    const responseText = document.getElementById('responseText');
    const buttonRow = document.querySelector('.button-row');
    const isTouch = window.matchMedia('(hover: none)').matches;
    let moved = false;

    function moveDaButton() {
      const rowRect = buttonRow.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const padding = 12;
      const maxX = Math.max(rowRect.width - btnRect.width - padding, 0);
      const maxY = Math.max(rowRect.height - btnRect.height - padding, 0);
      const x = Math.random() * maxX + padding;
      const y = Math.random() * maxY + padding;
      btn.style.position = 'absolute';
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
      btn.style.transform = 'none';
    }

    function resetDaButton() {
      btn.style.position = 'relative';
      btn.style.left = '';
      btn.style.top = '';
      btn.style.transform = '';
    }

    function showResponse(text) {
      responseText.textContent = text;
    }

    btn.addEventListener('click', () => {
      showResponse('Da! Te iubesc foarte mult. 💖');
    });

    noBtn.addEventListener('click', () => {
      showResponse('Nu? Hmm… cred că mi-e dor de tine oricum. 🍻');
    });

    if (isTouch) {
      btn.addEventListener('touchstart', (event) => {
        if (event.touches.length === 1) {
          moveDaButton();
        }
      }, { passive: true });
    } else {
      btn.addEventListener('mouseenter', () => {
        moved = !moved;
        btn.style.transform = moved ? 'translateX(150px)' : 'translateX(0)';
      });
    }

    window.addEventListener('resize', resetDaButton);
  </script>
</body>
</html>
